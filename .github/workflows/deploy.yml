name: Build & Deploy (Linux App Service)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  PROJECT_FILE: BrettGravesPortfolio.csproj     # your .csproj is in repo root
  PUBLISH_DIR: ${{ github.workspace }}/publish  # output directory

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Node (for Tailwind)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm deps
        run: npm ci

      - name: Build Tailwind CSS
        run: npx tailwindcss -i ./Styles/input.css -o ./wwwroot/css/site.css --minify

      - name: Restore
        run: dotnet restore $PROJECT_FILE

      - name: Build
        run: dotnet build $PROJECT_FILE -c Release --no-restore

      - name: Publish
        run: dotnet publish $PROJECT_FILE -c Release -o "$PUBLISH_DIR" --no-build

      # Deploy to your existing Linux App Service
      - name: Deploy to Azure WebApp
        uses: azure/webapps-deploy@v3
        with:
          app-name: brett-portfolio-web
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.PUBLISH_DIR }}
